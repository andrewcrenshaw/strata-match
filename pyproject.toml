[project]
name = "strata-match"
version = "0.1.3"
description = "Two-stage vector + LLM job-to-profile matching engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Andrew Crenshaw" },
]
keywords = ["job-search", "matching", "embeddings", "llm", "vector-search"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
gemini = [
    "google-genai>=1.0",
]
ollama = [
    "aiohttp>=3.9",
]
litellm = [
    "litellm>=1.50",
]
all = [
    "openai>=1.0",
    "google-genai>=1.0",
    "aiohttp>=3.9",
    "litellm>=1.50",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pdoc>=14.0",
]

[project.urls]
Homepage = "https://github.com/andrewcrenshaw/strata-match"
Repository = "https://github.com/andrewcrenshaw/strata-match"
Changelog = "https://github.com/andrewcrenshaw/strata-match/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/.venv", "/.venv-*", "/dist", "/build"]

[tool.hatch.build.targets.wheel]
packages = ["src/strata_match"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "openai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiohttp"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "litellm"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "verification: fast tests for CI verification slice",
    "integration: tests requiring external services",
]
